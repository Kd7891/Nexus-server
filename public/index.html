<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Free Video Meetings</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#07070f;color:#e8e8f5;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#1c1c2e;border-radius:2px}
button{cursor:pointer;border:none;font-family:'DM Sans',sans-serif}
input{font-family:'DM Sans',sans-serif;outline:none;border:none}

/* ── LOBBY ── */
#lobby{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:2rem;background:radial-gradient(ellipse at 50% 0%,#1a1040 0%,#07070f 65%)}
.l-logo{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.l-hex{width:38px;height:38px;background:linear-gradient(135deg,#6366f1,#a78bfa);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.l-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.5px}
.l-title{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;letter-spacing:-1.5px;text-align:center;line-height:1.1;margin-bottom:.6rem;background:linear-gradient(135deg,#e8e8f5 40%,#8b8bcf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.l-sub{color:#5a5a7a;font-size:14px;text-align:center;margin-bottom:1.75rem}
.l-card{background:#0d0d1a;border:1px solid #1c1c2e;border-radius:16px;padding:1.5rem;width:100%;max-width:380px;margin-bottom:1rem}
.l-input{width:100%;background:#12121f;border:1px solid #1c1c2e;border-radius:10px;padding:12px 14px;font-size:14px;color:#e8e8f5;transition:.2s;display:block}
.l-input:focus{border-color:#6366f1;background:#161628}
.l-input::placeholder{color:#3a3a5a}
.l-divider{height:1px;background:#1c1c2e;margin:10px 0}
.l-row{display:flex;gap:8px}
.l-gen{background:#1c1c2e;color:#8888aa;font-size:12px;padding:10px 12px;border-radius:8px;white-space:nowrap;flex-shrink:0;transition:.15s}
.l-gen:hover{background:#252540;color:#e8e8f5}
.l-join{width:100%;margin-top:12px;background:#6366f1;color:#fff;font-size:15px;font-weight:500;padding:13px;border-radius:10px;transition:.15s}
.l-join:hover{background:#5558e8;transform:translateY(-1px)}
.l-join:disabled{opacity:.35;cursor:not-allowed;transform:none}
.l-status{font-size:12px;text-align:center;padding:6px;min-height:24px}
.l-badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:380px}
.l-badge{background:#0d0d1a;border:1px solid #1c1c2e;border-radius:20px;padding:4px 12px;font-size:12px;color:#5a5a7a}

/* ── MEETING ── */
#meeting{display:none;flex-direction:column;height:100vh}
.m-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#0d0d1a;border-bottom:1px solid #1c1c2e;flex-shrink:0}
.m-hl{display:flex;align-items:center;gap:10px}
.m-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;letter-spacing:-.5px}
.m-room{background:#1c1c2e;border-radius:6px;padding:3px 10px;font-size:12px;color:#8888aa;letter-spacing:.5px}
.m-timer{display:flex;align-items:center;gap:6px;font-size:12px;color:#5a5a7a;font-variant-numeric:tabular-nums}
.m-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.m-hr{display:flex;align-items:center;gap:12px}
.m-pcount{font-size:12px;color:#5a5a7a}
.m-end{background:#ef4444;color:#fff;font-size:12px;font-weight:500;padding:6px 14px;border-radius:8px;transition:.15s}
.m-end:hover{background:#dc2626}

/* ── MAIN AREA ── */
.m-main{display:flex;flex:1;overflow:hidden}
.m-video-area{flex:1;padding:10px;display:flex;flex-direction:column;min-width:0}
#v-grid{flex:1;display:grid;gap:8px;grid-template-columns:1fr 1fr;min-height:0}
#v-grid.solo{grid-template-columns:1fr}
#v-grid.triple,#v-grid.quad{grid-template-columns:1fr 1fr}

/* ── VIDEO TILE ── */
.v-tile{border-radius:12px;overflow:hidden;position:relative;background:#0d0d1a;border:1px solid #1c1c2e}
.v-tile video{width:100%;height:100%;object-fit:cover;display:block}
.v-tile.cam-off video{display:none}
.v-avatar{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;display:none}
.v-tile.cam-off .v-avatar{display:flex}
.v-initials{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:20px;background:#6366f133;color:#6366f1;border:1.5px solid #6366f155}
.v-camoff-lbl{font-size:11px;color:#4a4a6a}
.v-nametag{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:500;color:#cccce0;display:flex;align-items:center;gap:5px}
.v-you-badge{color:#6366f1;font-size:10px}
.v-muted{font-size:11px}
.v-conn-state{position:absolute;top:8px;right:8px;font-size:10px;background:rgba(0,0,0,.6);border-radius:4px;padding:2px 6px;color:#f59e0b}

/* ── SIDEBAR ── */
.m-sidebar{width:0;overflow:hidden;transition:width .25s;border-left:1px solid #1c1c2e;display:flex;flex-direction:column;background:#0d0d1a;flex-shrink:0}
.m-sidebar.open{width:285px}
.s-tabs{display:flex;align-items:center;border-bottom:1px solid #1c1c2e;padding:0 12px;flex-shrink:0}
.s-tab{flex:1;padding:12px 0;font-size:13px;font-weight:500;color:#5a5a7a;background:transparent;border-bottom:2px solid transparent;transition:.15s;margin-bottom:-1px}
.s-tab.active{color:#e8e8f5;border-bottom-color:#6366f1}
.s-close{margin-left:auto;background:transparent;color:#3a3a5a;font-size:16px;padding:4px 6px;border-radius:4px;transition:.15s}
.s-close:hover{color:#8888aa;background:#1c1c2e}

/* ── CHAT ── */
.chat-panel{display:flex;flex-direction:column;flex:1;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.chat-msg{display:flex;gap:8px}
.chat-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.chat-body{flex:1;min-width:0}
.chat-meta{display:flex;align-items:baseline;gap:6px;margin-bottom:3px}
.chat-name{font-size:12px;font-weight:500;color:#c0c0e0}
.chat-time{font-size:10px;color:#3a3a5a}
.chat-text{font-size:13px;color:#8888aa;line-height:1.4;word-break:break-word}
.chat-inp-row{display:flex;gap:6px;padding:10px 12px;border-top:1px solid #1c1c2e;flex-shrink:0}
.chat-inp{flex:1;background:#12121f;border:1px solid #1c1c2e;border-radius:8px;padding:8px 12px;font-size:13px;color:#e8e8f5;transition:.15s}
.chat-inp:focus{border-color:#6366f1}
.chat-inp::placeholder{color:#3a3a5a}
.chat-send{background:#6366f1;color:#fff;width:32px;height:32px;border-radius:8px;font-size:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chat-send:hover{background:#5558e8}

/* ── WHITEBOARD ── */
.wb-panel{display:flex;flex-direction:column;flex:1;overflow:hidden}
.wb-toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #1c1c2e;flex-wrap:wrap;flex-shrink:0}
.wb-btn{background:#1c1c2e;border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#8888aa;transition:.15s}
.wb-btn:hover{background:#252540}
.wb-btn.active{background:#6366f1;color:#fff}
.wb-swatch{width:18px;height:18px;border-radius:50%;flex-shrink:0;transition:.15s}
.wb-swatch:hover{transform:scale(1.2)}
.wb-clear{margin-left:auto;background:transparent;color:#5a5a7a;font-size:11px;padding:4px 8px;border-radius:5px}
.wb-clear:hover{background:#1c1c2e;color:#e8e8f5}
#wb-canvas{cursor:crosshair;width:100%;height:100%;display:block;background:#07070f}

/* ── CONTROLS ── */
.m-controls{background:#0d0d1a;border-top:1px solid #1c1c2e;padding:10px 16px;display:flex;justify-content:center;flex-shrink:0}
.ctrl-row{display:flex;gap:6px;align-items:center}
.ctrl-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:#12121f;border:1px solid #1c1c2e;border-radius:10px;padding:8px 12px;min-width:52px;transition:.15s;color:#8888aa}
.ctrl-btn:hover{background:#1a1a2e;color:#e8e8f5}
.ctrl-btn.active{background:#1e1e40;border-color:#6366f1;color:#6366f1}
.ctrl-btn.off{background:#1f1010;border-color:#3a1515;color:#ef4444}
.ctrl-icon{font-size:18px;line-height:1}
.ctrl-lbl{font-size:9px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.ctrl-sep{width:1px;height:32px;background:#1c1c2e;margin:0 4px}
.ctrl-end{background:#ef4444!important;border-color:#ef4444!important;color:#fff!important}
.ctrl-end:hover{background:#dc2626!important}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════
     LOBBY
═══════════════════════════════════════════════ -->
<div id="lobby">
  <div class="l-logo">
    <div class="l-hex">◈</div>
    <span class="l-name">nexus</span>
  </div>
  <h1 class="l-title">Meet without<br>limits.</h1>
  <p class="l-sub">Free · encrypted · no time limits · no account needed</p>

  <div class="l-card">
    <input class="l-input" id="inp-name" placeholder="Your name" autocomplete="off" maxlength="30">
    <div class="l-divider"></div>
    <div class="l-row">
      <input class="l-input" id="inp-room" placeholder="Room code (optional)" autocomplete="off" maxlength="12" style="flex:1">
      <button class="l-gen" onclick="genCode()">Generate</button>
    </div>
    <button class="l-join" id="join-btn" onclick="joinMeeting()" disabled>Start meeting →</button>
  </div>

  <div class="l-status" id="lobby-status"></div>

  <div class="l-badges">
    <span class="l-badge">🔒 Encrypted</span>
    <span class="l-badge">⏱ No time limits</span>
    <span class="l-badge">👥 Up to 50 people</span>
    <span class="l-badge">🆓 Always free</span>
  </div>
</div>

<!-- ═══════════════════════════════════════════════
     MEETING ROOM
═══════════════════════════════════════════════ -->
<div id="meeting">
  <!-- Header -->
  <div class="m-header">
    <div class="m-hl">
      <span class="m-logo">nexus</span>
      <span class="m-room" id="hdr-room">ROOM</span>
      <span class="m-timer"><span class="m-dot"></span><span id="hdr-timer">00:00</span></span>
    </div>
    <div class="m-hr">
      <span class="m-pcount" id="hdr-count">1 participant</span>
      <button class="m-end" onclick="leaveMeeting()">End call</button>
    </div>
  </div>

  <!-- Main -->
  <div class="m-main">
    <div class="m-video-area">
      <div id="v-grid" class="solo"></div>
    </div>

    <!-- Sidebar -->
    <div class="m-sidebar" id="sidebar">
      <div class="s-tabs">
        <button class="s-tab active" id="tab-chat" onclick="switchTab('chat')">Chat</button>
        <button class="s-tab" id="tab-wb" onclick="switchTab('whiteboard')">Whiteboard</button>
        <button class="s-close" onclick="closePanel()">✕</button>
      </div>

      <!-- Chat panel -->
      <div class="chat-panel" id="panel-chat">
        <div class="chat-msgs" id="chat-msgs"></div>
        <div class="chat-inp-row">
          <input class="chat-inp" id="chat-inp" placeholder="Message everyone..." onkeydown="if(event.key==='Enter')sendChat()">
          <button class="chat-send" onclick="sendChat()">↑</button>
        </div>
      </div>

      <!-- Whiteboard panel -->
      <div class="wb-panel" id="panel-wb" style="display:none">
        <div class="wb-toolbar" id="wb-toolbar"></div>
        <canvas id="wb-canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="m-controls">
    <div class="ctrl-row">
      <button class="ctrl-btn active" id="btn-mic" onclick="toggleMic()">
        <span class="ctrl-icon" id="ico-mic">🎤</span>
        <span class="ctrl-lbl" id="lbl-mic">Mic</span>
      </button>
      <button class="ctrl-btn active" id="btn-cam" onclick="toggleCam()">
        <span class="ctrl-icon" id="ico-cam">📷</span>
        <span class="ctrl-lbl" id="lbl-cam">Camera</span>
      </button>
      <div class="ctrl-sep"></div>
      <button class="ctrl-btn" id="btn-wb" onclick="openPanel('whiteboard')">
        <span class="ctrl-icon">✏️</span>
        <span class="ctrl-lbl">Board</span>
      </button>
      <button class="ctrl-btn active" id="btn-chat" onclick="openPanel('chat')">
        <span class="ctrl-icon">💬</span>
        <span class="ctrl-lbl">Chat</span>
      </button>
      <div class="ctrl-sep"></div>
      <button class="ctrl-btn ctrl-end" onclick="leaveMeeting()">
        <span class="ctrl-icon">📵</span>
        <span class="ctrl-lbl">Leave</span>
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════
     APP LOGIC
═══════════════════════════════════════════════ -->
<script>
// ── CONFIG ────────────────────────────────────
const SERVER = 'https://nexus-server-1lyf.onrender.com';
const ICE = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' }
  ]
};
const COLORS = ['#6366f1','#f43f5e','#22c55e','#f59e0b','#e879f9','#ffffff'];

// ── STATE ─────────────────────────────────────
let socket;
let localStream = null;
let peerConns   = new Map(); // socketId → RTCPeerConnection
let remoteStreams= new Map(); // socketId → MediaStream
let participants = new Map(); // socketId → {name, socketId}
let mySocketId  = null;
let myName      = '';
let currentRoom = '';
let micOn = true, camOn = true;
let timerInterval = null, elapsed = 0;

// Whiteboard
let isDrawing = false, lastX = 0, lastY = 0;
let wbTool = 'pen', wbColor = '#6366f1', wbSize = 3;
let snapshot = null;
let startX = 0, startY = 0;

// ── LOBBY ─────────────────────────────────────
document.getElementById('inp-name').addEventListener('input', function() {
  document.getElementById('join-btn').disabled = !this.value.trim();
});
document.getElementById('inp-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') joinMeeting();
});

function genCode() {
  document.getElementById('inp-room').value = Math.random().toString(36).substr(2,6).toUpperCase();
}

function setStatus(msg, color) {
  const el = document.getElementById('lobby-status');
  el.textContent = msg;
  el.style.color = color || '#5a5a7a';
}

// ── JOIN MEETING ──────────────────────────────
async function joinMeeting() {
  myName = document.getElementById('inp-name').value.trim();
  if (!myName) return;

  currentRoom = (document.getElementById('inp-room').value.trim() || genRoomCode()).toUpperCase();

  setStatus('Requesting camera & microphone…');
  document.getElementById('join-btn').disabled = true;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch(e) {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      setStatus('Camera not found — audio only', '#f59e0b');
    } catch(e2) {
      setStatus('⚠ Could not access camera or mic. Please allow permission and try again.', '#ef4444');
      document.getElementById('join-btn').disabled = false;
      return;
    }
  }

  setStatus('Connecting to server…');
  showMeeting();
  initSocket();
}

function genRoomCode() {
  const code = Math.random().toString(36).substr(2,6).toUpperCase();
  return code;
}

// ── SHOW MEETING UI ───────────────────────────
function showMeeting() {
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('meeting').style.display = 'flex';
  document.getElementById('hdr-room').textContent = currentRoom;

  // My video tile
  buildMyTile();
  openPanel('chat');
  buildWbToolbar();
  setupCanvas();
  startTimer();
}

// ── SOCKET ───────────────────────────────────
function initSocket() {
  socket = io(SERVER, { transports: ['websocket','polling'] });

  socket.on('connect', () => {
    mySocketId = socket.id;
    socket.emit('join-room', { roomCode: currentRoom, name: myName });
  });

  socket.on('connect_error', () => {
    setStatus('⚠ Cannot reach server. Check your connection.', '#ef4444');
  });

  // We just joined — initiate offers to everyone already in the room
  socket.on('room-joined', async ({ participants: existing }) => {
    for (const p of existing) {
      participants.set(p.socketId, p);
      addRemoteTile(p.socketId, p.name);
      await createOffer(p.socketId);
    }
    updateParticipantCount();
  });

  // Someone joined after us — they'll send us an offer
  socket.on('participant-joined', ({ socketId, name }) => {
    participants.set(socketId, { socketId, name });
    addRemoteTile(socketId, name);
    updateParticipantCount();
  });

  // Someone left
  socket.on('participant-left', ({ socketId }) => {
    participants.delete(socketId);
    closePeer(socketId);
    removeTile(socketId);
    updateParticipantCount();
  });

  // Incoming offer → send answer
  socket.on('offer', async ({ fromSocketId, fromName, offer }) => {
    if (!participants.has(fromSocketId)) {
      participants.set(fromSocketId, { socketId: fromSocketId, name: fromName });
      addRemoteTile(fromSocketId, fromName);
      updateParticipantCount();
    }
    const pc = getOrCreatePC(fromSocketId);
    await pc.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('answer', { targetSocketId: fromSocketId, answer });
  });

  // Incoming answer
  socket.on('answer', async ({ fromSocketId, answer }) => {
    const pc = peerConns.get(fromSocketId);
    if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
  });

  // ICE candidate
  socket.on('ice-candidate', async ({ fromSocketId, candidate }) => {
    const pc = peerConns.get(fromSocketId);
    if (pc && candidate) {
      try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e) {}
    }
  });

  // Chat
  socket.on('chat-message', ({ fromSocketId, name, message, time }) => {
    appendChatMsg({ name, message, time, isMe: fromSocketId === mySocketId });
  });

  // Whiteboard
  socket.on('draw-event', drawRemote);
  socket.on('clear-board', clearCanvasLocal);
}

// ── WebRTC ────────────────────────────────────
function getOrCreatePC(socketId) {
  if (peerConns.has(socketId)) return peerConns.get(socketId);

  const pc = new RTCPeerConnection(ICE);

  // Add local tracks to the connection
  if (localStream) {
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  }

  // When we receive remote media
  const remoteStream = new MediaStream();
  remoteStreams.set(socketId, remoteStream);

  pc.ontrack = (event) => {
    event.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
    const video = document.querySelector(`#tile-${socketId} video`);
    if (video) video.srcObject = remoteStream;
    setTileConnected(socketId);
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      socket.emit('ice-candidate', { targetSocketId: socketId, candidate: event.candidate });
    }
  };

  pc.onconnectionstatechange = () => {
    const state = pc.connectionState;
    const badge = document.querySelector(`#tile-${socketId} .v-conn-state`);
    if (badge) {
      if (state === 'connected') badge.style.display = 'none';
      else if (state === 'connecting') { badge.textContent = 'Connecting…'; badge.style.display = 'block'; }
      else if (state === 'failed') { badge.textContent = 'Failed'; badge.style.display = 'block'; }
    }
    if (state === 'failed' || state === 'disconnected') {
      closePeer(socketId);
    }
  };

  peerConns.set(socketId, pc);
  return pc;
}

async function createOffer(targetSocketId) {
  const pc = getOrCreatePC(targetSocketId);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('offer', { targetSocketId, offer });
}

function closePeer(socketId) {
  const pc = peerConns.get(socketId);
  if (pc) { pc.close(); peerConns.delete(socketId); }
  remoteStreams.delete(socketId);
}

// ── VIDEO TILES ───────────────────────────────
function buildMyTile() {
  const grid = document.getElementById('v-grid');
  grid.innerHTML = '';

  const tile = document.createElement('div');
  tile.className = 'v-tile';
  tile.id = `tile-${mySocketId || 'me'}`;

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  video.muted = true; // Mute own video to avoid echo
  if (localStream) video.srcObject = localStream;

  const avatar = document.createElement('div');
  avatar.className = 'v-avatar';
  avatar.innerHTML = `<div class="v-initials">${initials(myName)}</div><span class="v-camoff-lbl">Camera off</span>`;

  const tag = document.createElement('div');
  tag.className = 'v-nametag';
  tag.innerHTML = `${myName} <span class="v-you-badge">(you)</span>`;

  tile.appendChild(video);
  tile.appendChild(avatar);
  tile.appendChild(tag);
  grid.appendChild(tile);

  updateGridLayout();
}

function addRemoteTile(socketId, name) {
  const grid = document.getElementById('v-grid');
  const existing = document.getElementById(`tile-${socketId}`);
  if (existing) return;

  const tile = document.createElement('div');
  tile.className = 'v-tile';
  tile.id = `tile-${socketId}`;

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;

  const avatar = document.createElement('div');
  avatar.className = 'v-avatar';
  avatar.innerHTML = `<div class="v-initials" style="background:#f59e0b22;color:#f59e0b;border-color:#f59e0b44">${initials(name)}</div><span class="v-camoff-lbl">Connecting…</span>`;

  const tag = document.createElement('div');
  tag.className = 'v-nametag';
  tag.textContent = name;

  const connBadge = document.createElement('div');
  connBadge.className = 'v-conn-state';
  connBadge.textContent = 'Connecting…';

  tile.appendChild(video);
  tile.appendChild(avatar);
  tile.appendChild(tag);
  tile.appendChild(connBadge);
  grid.appendChild(tile);

  updateGridLayout();
}

function setTileConnected(socketId) {
  const tile = document.getElementById(`tile-${socketId}`);
  if (!tile) return;
  const badge = tile.querySelector('.v-conn-state');
  if (badge) badge.style.display = 'none';
  const avatar = tile.querySelector('.v-camoff-lbl');
  if (avatar) avatar.textContent = 'Camera off';
}

function removeTile(socketId) {
  const tile = document.getElementById(`tile-${socketId}`);
  if (tile) tile.remove();
  updateGridLayout();
}

function updateGridLayout() {
  const grid = document.getElementById('v-grid');
  const count = grid.children.length;
  grid.className = count <= 1 ? 'solo' : count === 3 ? 'triple' : count === 4 ? 'quad' : '';
}

function updateParticipantCount() {
  const n = 1 + participants.size;
  document.getElementById('hdr-count').textContent = n + (n === 1 ? ' participant' : ' participants');
}

// ── CAMERA & MIC CONTROLS ─────────────────────
function toggleMic() {
  micOn = !micOn;
  if (localStream) {
    localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  }
  document.getElementById('btn-mic').className = 'ctrl-btn ' + (micOn ? 'active' : 'off');
  document.getElementById('ico-mic').textContent = micOn ? '🎤' : '🔇';
  document.getElementById('lbl-mic').textContent = micOn ? 'Mic' : 'Muted';
}

function toggleCam() {
  camOn = !camOn;
  if (localStream) {
    localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  }
  document.getElementById('btn-cam').className = 'ctrl-btn ' + (camOn ? 'active' : 'off');
  document.getElementById('ico-cam').textContent = camOn ? '📷' : '📵';
  document.getElementById('lbl-cam').textContent = camOn ? 'Camera' : 'Cam off';

  const myTile = document.getElementById(`tile-${mySocketId || 'me'}`);
  if (myTile) myTile.classList.toggle('cam-off', !camOn);
}

// ── LEAVE ─────────────────────────────────────
function leaveMeeting() {
  if (socket) { socket.emit('leave-room'); socket.disconnect(); }
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  peerConns.forEach(pc => pc.close());
  peerConns.clear();
  remoteStreams.clear();
  participants.clear();
  localStream = null;
  clearInterval(timerInterval);
  elapsed = 0;
  document.getElementById('hdr-timer').textContent = '00:00';
  document.getElementById('meeting').style.display = 'none';
  document.getElementById('lobby').style.display = 'flex';
  document.getElementById('join-btn').disabled = false;
  setStatus('');
}

// ── TIMER ─────────────────────────────────────
function startTimer() {
  clearInterval(timerInterval);
  elapsed = 0;
  timerInterval = setInterval(() => {
    elapsed++;
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('hdr-timer').textContent = m + ':' + s;
  }, 1000);
}

// ── CHAT ──────────────────────────────────────
function sendChat() {
  const inp = document.getElementById('chat-inp');
  const msg = inp.value.trim();
  if (!msg || !socket) return;
  socket.emit('chat-message', { message: msg });
  inp.value = '';
}

function appendChatMsg({ name, message, time, isMe }) {
  const msgs = document.getElementById('chat-msgs');
  const color = isMe ? '#6366f1' : '#f59e0b';
  const init  = initials(name);
  const div = document.createElement('div');
  div.className = 'chat-msg';
  div.innerHTML = `
    <div class="chat-av" style="background:${color}22;color:${color}">${init}</div>
    <div class="chat-body">
      <div class="chat-meta">
        <span class="chat-name">${name}</span>
        <span class="chat-time">${time}</span>
      </div>
      <p class="chat-text">${escapeHtml(message)}</p>
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

// ── PANEL / TAB ───────────────────────────────
function openPanel(p) {
  document.getElementById('sidebar').classList.add('open');
  switchTab(p);
  document.getElementById('btn-chat').className = 'ctrl-btn ' + (p === 'chat' ? 'active' : '');
  document.getElementById('btn-wb').className   = 'ctrl-btn ' + (p === 'whiteboard' ? 'active' : '');
}

function closePanel() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('btn-chat').className = 'ctrl-btn';
  document.getElementById('btn-wb').className   = 'ctrl-btn';
}

function switchTab(t) {
  document.getElementById('tab-chat').className = 's-tab ' + (t === 'chat' ? 'active' : '');
  document.getElementById('tab-wb').className   = 's-tab ' + (t === 'whiteboard' ? 'active' : '');
  document.getElementById('panel-chat').style.display = t === 'chat' ? 'flex' : 'none';
  document.getElementById('panel-wb').style.display   = t === 'whiteboard' ? 'flex' : 'none';
  if (t === 'whiteboard') setTimeout(resizeCanvas, 50);
}

// ── WHITEBOARD ────────────────────────────────
function buildWbToolbar() {
  const tb = document.getElementById('wb-toolbar');
  tb.innerHTML = '';

  const tools = [
    {id:'pen',label:'✏'},
    {id:'line',label:'╱'},
    {id:'rect',label:'▭'},
    {id:'eraser',label:'⌫'}
  ];
  tools.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'wb-btn' + (t.id === 'pen' ? ' active' : '');
    btn.id = 'wt-' + t.id;
    btn.textContent = t.label;
    btn.title = t.id;
    btn.onclick = () => setWbTool(t.id);
    tb.appendChild(btn);
  });

  COLORS.forEach(c => {
    const s = document.createElement('button');
    s.className = 'wb-swatch';
    s.style.cssText = `background:${c};border:${c===wbColor?'2px solid #fff':'1px solid #333'}`;
    s.title = c;
    s.onclick = () => setWbColor(c);
    tb.appendChild(s);
  });

  [2,4,8].forEach(sz => {
    const b = document.createElement('button');
    b.className = 'wb-btn' + (sz === 3 ? ' active' : '');
    b.id = 'wsz-' + sz;
    b.onclick = () => setWbSize(sz);
    const dot = document.createElement('div');
    dot.style.cssText = `width:${sz*2}px;height:${sz*2}px;border-radius:50%;background:#aaa;margin:auto`;
    b.appendChild(dot);
    tb.appendChild(b);
  });

  const clr = document.createElement('button');
  clr.className = 'wb-clear';
  clr.textContent = 'Clear all';
  clr.onclick = () => { clearCanvasLocal(); if (socket) socket.emit('clear-board'); };
  tb.appendChild(clr);
}

function setWbTool(t) {
  wbTool = t;
  document.querySelectorAll('#wb-toolbar .wb-btn').forEach(b => {
    if (b.id && b.id.startsWith('wt-')) b.className = 'wb-btn' + (b.id === 'wt-' + t ? ' active' : '');
  });
}
function setWbColor(c) {
  wbColor = c;
  if (wbTool === 'eraser') setWbTool('pen');
  document.querySelectorAll('.wb-swatch').forEach(s => {
    s.style.border = s.style.background === c || s.title === c ? '2px solid #fff' : '1px solid #333';
  });
}
function setWbSize(s) {
  wbSize = s;
  document.querySelectorAll('#wb-toolbar .wb-btn').forEach(b => {
    if (b.id && b.id.startsWith('wsz-')) b.className = 'wb-btn' + (b.id === 'wsz-' + s ? ' active' : '');
  });
}

function setupCanvas() {
  const canvas = document.getElementById('wb-canvas');
  resizeCanvas();

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const sx = canvas.width / r.width, sy = canvas.height / r.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * sx, y: (src.clientY - r.top) * sy };
  }

  canvas.addEventListener('mousedown', e => {
    isDrawing = true;
    const p = getPos(e);
    lastX = startX = p.x; lastY = startY = p.y;
    if (wbTool === 'line' || wbTool === 'rect') {
      snapshot = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
    } else {
      const ctx = canvas.getContext('2d');
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
    }
  });

  canvas.addEventListener('mousemove', e => {
    if (!isDrawing) return;
    const p = getPos(e);
    const ctx = canvas.getContext('2d');
    drawSegment(ctx, lastX, lastY, p.x, p.y, wbTool, wbColor, wbSize);
    if (socket && (wbTool === 'pen' || wbTool === 'eraser')) {
      emitDraw(lastX, lastY, p.x, p.y, wbTool, wbColor, wbSize);
    }
    lastX = p.x; lastY = p.y;
  });

  canvas.addEventListener('mouseup', e => {
    if (!isDrawing) return;
    const p = getPos(e);
    const ctx = canvas.getContext('2d');
    if (wbTool === 'line') {
      if (snapshot) ctx.putImageData(snapshot, 0, 0);
      drawSegment(ctx, startX, startY, p.x, p.y, 'line', wbColor, wbSize);
      if (socket) emitDraw(startX, startY, p.x, p.y, 'line', wbColor, wbSize);
    } else if (wbTool === 'rect') {
      if (snapshot) ctx.putImageData(snapshot, 0, 0);
      ctx.strokeStyle = wbColor; ctx.lineWidth = wbSize;
      ctx.strokeRect(startX, startY, p.x - startX, p.y - startY);
      if (socket) emitDraw(startX, startY, p.x, p.y, 'rect', wbColor, wbSize);
    }
    isDrawing = false; snapshot = null;
    ctx.beginPath();
  });

  const stop = () => { isDrawing = false; snapshot = null; };
  canvas.addEventListener('mouseleave', stop);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mousedown', {clientX:e.touches[0].clientX,clientY:e.touches[0].clientY})); }, {passive:false});
  canvas.addEventListener('touchmove',  e => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mousemove',  {clientX:e.touches[0].clientX,clientY:e.touches[0].clientY})); }, {passive:false});
  canvas.addEventListener('touchend',   e => { e.preventDefault(); stop(); }, {passive:false});
}

function resizeCanvas() {
  const canvas = document.getElementById('wb-canvas');
  const wrap = canvas.parentElement;
  if (!wrap) return;
  const saved = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
  canvas.width  = wrap.clientWidth  || 280;
  canvas.height = wrap.clientHeight || 380;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#07070f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.putImageData(saved, 0, 0);
}

function drawSegment(ctx, x0, y0, x1, y1, tool, color, size) {
  ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = tool === 'eraser' ? 'rgba(0,0,0,1)' : color;
  ctx.lineWidth   = tool === 'eraser' ? 18 : size;
  ctx.lineCap     = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}

function emitDraw(x0, y0, x1, y1, tool, color, size) {
  const canvas = document.getElementById('wb-canvas');
  const w = canvas.width, h = canvas.height;
  socket.emit('draw-event', {
    tool, color, size,
    x0: x0/w, y0: y0/h,
    x1: x1/w, y1: y1/h
  });
}

function drawRemote({ tool, color, size, x0, y0, x1, y1 }) {
  const canvas = document.getElementById('wb-canvas');
  const ctx = canvas.getContext('2d');
  drawSegment(ctx, x0 * canvas.width, y0 * canvas.height, x1 * canvas.width, y1 * canvas.height, tool, color, size);
}

function clearCanvasLocal() {
  const canvas = document.getElementById('wb-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#07070f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ── HELPERS ───────────────────────────────────
function initials(name) {
  return (name || '?').trim().split(' ').map(w => w[0]).join('').substr(0,2).toUpperCase();
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
